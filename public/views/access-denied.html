<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden - Host Restricted</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">

  <div class="mobile-card" style="max-width: 460px; width: 100%; text-align: center;">
    <div style="background: #0f172a; color: white; padding: 2rem 1.5rem;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔒</div>
      <h2 style="font-size: 1.4rem; font-weight: 800;">403 Forbidden: Host Only</h2>
      <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 0.25rem;">Instructor Access Restricted</p>
    </div>

    <div class="mobile-card-body" style="padding: 1.75rem;">
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
        This administration section is restricted to the host computer. Student devices on the Wi-Fi network are not permitted to view or modify these records.
      </p>

      <a href="/student" class="btn btn-primary btn-full">
        📱 Return to Student Attendance Portal
      </a>
      <a href="/" class="btn btn-outline btn-full" style="margin-top: 0.5rem;">
        🏠 Try Host Login
      </a>
    </div>
  </div>

</body>
</html>
